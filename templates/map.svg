    <circle cx="70" cy="210" r="5"/><text x="52" y="234">ORD</text>
    <circle cx="120" cy="190" r="5"/><text x="104" y="176">YYZ</text>
    <circle cx="360" cy="200" r="5"/><text x="344" y="224">EMA</text>
    <circle cx="410" cy="120" r="5"/><text x="394" y="146">OSL</text>
    <circle cx="490" cy="100" r="5"/><text x="476" y="86">HEL</text>
    <circle cx="470" cy="160" r="5"/><text x="456" y="184">RIX</text>
  </g>
  <text x="24" y="336" font-size="12" fill="#9FB2CA" aria-hidden="true">{{ t.hero.map_caption }}</text>
</svg>
