<svg class="map" viewBox="0 0 560 360" role="img" aria-label="{{ t.hero.map_caption }}">
  <rect x="0" y="0" width="560" height="360" rx="16" fill="#0F2C4F"/>
  <g stroke="#1E4069" stroke-width="1">
    <line x1="0" y1="90" x2="560" y2="90"/><line x1="0" y1="180" x2="560" y2="180"/><line x1="0" y1="270" x2="560" y2="270"/>
    <line x1="140" y1="0" x2="140" y2="360"/><line x1="280" y1="0" x2="280" y2="360"/><line x1="420" y1="0" x2="420" y2="360"/>
  </g>
  <g fill="none" stroke="#F2C230" stroke-width="2" stroke-dasharray="5 5" opacity="0.9">
    <path d="M260 90 Q 160 80 70 210"/>
    <path d="M260 90 Q 180 110 120 190"/>
    <path d="M260 90 Q 330 120 360 200"/>
    <path d="M260 90 Q 360 70 410 120"/>
