<svg class="map" viewBox="0 0 560 340" role="img" aria-label="{{ t.hero.map_caption }}">
  <defs>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A9CDF5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="340" rx="16" fill="#0F2C4F"/>
  <g stroke="#1E4069" stroke-width="1">
    <line x1="0" y1="85" x2="560" y2="85"/><line x1="0" y1="170" x2="560" y2="170"/><line x1="0" y1="255" x2="560" y2="255"/>
    <line x1="140" y1="0" x2="140" y2="340"/><line x1="280" y1="0" x2="280" y2="340"/><line x1="420" y1="0" x2="420" y2="340"/>
  </g>

  <!-- Onward destinations (blue): via DHL's EMA hub, and via Finnair's HEL hub -->
  <g fill="none" stroke="#7FB3F0" stroke-width="1.6" stroke-dasharray="3 4" opacity="0.95">
    <!-- from EMA -->
    <path d="M355 190 Q 330 170 305 172"/>
    <path d="M355 190 Q 380 188 408 202"/>
    <path d="M355 190 Q 345 235 322 268"/>
    <path d="M355 190 Q 420 220 452 282"/>
    <path d="M355 190 Q 455 170 528 228"/>
    <path d="M355 190 Q 260 200 168 250"/>
    <path d="M355 190 Q 250 210 130 232"/>
    <path d="M355 190 Q 260 150 162 166"/>
    <!-- from HEL -->
    <path d="M480 90 Q 450 170 398 236"/>
    <path d="M480 90 Q 515 70 548 52" marker-end="url(#map-arrow)"/>
  </g>

  <!-- First stops from KEF (yellow) -->
  <g fill="none" stroke="#F2C230" stroke-width="2" stroke-dasharray="5 5" opacity="0.95">
    <path d="M250 80 Q 150 75 55 210"/>
    <path d="M250 80 Q 165 100 105 186"/>
    <path d="M250 80 Q 320 110 355 190"/>
    <path d="M250 80 Q 340 62 390 110"/>
    <path d="M250 80 Q 380 48 480 90"/>
    <path d="M250 80 Q 400 92 460 140"/>
  </g>

  <g font-size="13" font-weight="600" aria-hidden="true">
    <!-- KEF -->
    <circle cx="250" cy="80" r="9" fill="#F2C230"/>
    <text x="236" y="61" fill="#FFFFFF" font-size="15">KEF</text>

    <!-- first stops -->
    <g fill="#E3EAF3">
      <circle cx="55" cy="210" r="5"/><text x="38" y="233">ORD</text>
      <circle cx="105" cy="186" r="5"/><text x="74" y="179">YYZ</text>
      <circle cx="355" cy="190" r="5"/><text x="362" y="180">EMA</text>
      <circle cx="390" cy="110" r="5"/><text x="400" y="114">OSL</text>
      <circle cx="480" cy="90" r="5"/><text x="456" y="77">HEL</text>
      <circle cx="460" cy="140" r="5"/><text x="470" y="144">RIX</text>
    </g>

    <!-- onward destinations -->
    <g fill="#A9CDF5" font-size="12">
      <circle cx="305" cy="172" r="4"/><text x="281" y="161">DUB</text>
      <circle cx="408" cy="202" r="4"/><text x="417" y="200">BRU</text>
      <circle cx="398" cy="236" r="4"/><text x="406" y="249">CDG</text>
      <circle cx="322" cy="268" r="4"/><text x="307" y="289">MAD</text>
      <circle cx="452" cy="282" r="4"/><text x="437" y="303">DWC</text>
      <circle cx="528" cy="228" r="4"/><text x="512" y="216">PVG</text>
      <circle cx="162" cy="166" r="4"/><text x="150" y="155">YUL</text>
      <circle cx="130" cy="232" r="4"/><text x="98" y="236">EWR</text>
      <circle cx="168" cy="250" r="4"/><text x="156" y="272">JFK</text>
      <text x="550" y="40" text-anchor="end">{{ t.hero.region_asia }}</text>
    </g>
  </g>
</svg>
